<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Two Audio Dots</title>
        <meta name="description" 
        content="Dots that make different sounds when clicked and that can be moved around in an X-Y plane"
        />
        <meta name="viewport" 
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link rel="stylesheet" type="text/css" href="style.css"/>

        <script src="interaction.js" type="module" defer></script>
        <link rel="icon" type="image/png" href="./images/favicon.png"/>
    </head>
    <body>
        <h1>Audio Dots</h1>

        <div id="experimentText">
        <p>Please use over-ear headphones to complete the experiment. When you have completed the experiment, please press Finish.</p>
        </div>

        <div class="workspace">
            <canvas id="xy-plane">
                Sorry, your browser does not support canvas.
            </canvas>
        </div>

        <button id="finish" type="button">
            Finish
        </button>
        <div id="status" aria-live="polite"></div>
    </body>
</html>
